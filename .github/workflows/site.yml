# Builds the BibleOS landing page (apps/site in the private source repo) and publishes it to
# GitHub Pages at https://bibleos.roobi.dev/.
# The page reads the latest release at runtime, so it only needs a new deploy when the site changes.
#
# The canonical copy of this file lives in the source repo at release-repo/.github/workflows/.
name: Site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the source repo to build
        required: true
        default: main

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: roobiwebdev/BibleOS
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter site build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
