# Builds BibleOS for macOS (one universal app for Apple Silicon and Intel), Windows and Linux
# from the private source repo, signs the update files with the BibleOS updater key, and
# uploads everything to a draft release in THIS public repo. Publishing the draft is what makes
# it the version installed apps update to.
#
# The canonical copy of this file lives in the source repo at release-repo/.github/workflows/.
# Run it from the Actions tab (or `gh workflow run release.yml -R roobiwebdev/BibleOS-releases`).
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the source repo to build
        required: true
        default: main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: Linux x64
            # The oldest supported runner keeps the .deb and AppImage working on older distributions.
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      # The source is private; a read-only deploy key on that repo lets this job read it.
      - uses: actions/checkout@v4
        with:
          repository: roobiwebdev/BibleOS
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The translation archives are pinned by SHA-256 in packages/bible-data/src/manifest.ts,
      # so the cache key changes whenever a source changes.
      - uses: actions/cache@v4
        with:
          path: packages/bible-data/.cache
          key: bible-sources-${{ hashFiles('packages/bible-data/src/manifest.ts') }}

      - name: Build the bundled Bibles
        run: pnpm --filter desktop bibles

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: BibleOS __VERSION__
          releaseBody: |
            Download the file for your computer below. Install guide: https://bibleos.roobi.dev/#install

            - **Mac** (Apple Silicon and Intel): `BibleOS_*_universal.dmg`
            - **Windows**: `BibleOS_*_x64-setup.exe`
            - **Linux**: `.AppImage`, `.deb` or `.rpm`

            Already using BibleOS? It will offer this update when it opens.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
